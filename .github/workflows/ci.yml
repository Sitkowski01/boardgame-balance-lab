name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Baza dla play/replay na zywo; testy integracyjne stawiaja wlasne kontenery (Testcontainers).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Testy (jednostkowe, wlasnosci FsCheck, statystyczne, sily botow, architektura, integracyjne, hub SignalR i e2e na PostgreSQL)
        run: dotnet test
      - name: Benchmarki uruchamiaja sie (przebieg probny)
        run: dotnet run -c Release --project benchmarks/BalanceLab.Benchmarks -- --filter '*' --job dry
      - name: CLI na zywo
        run: dotnet run --project src/BalanceLab.Cli -- simulate --game connectfour --bots mcts:100 random --games 200 --out report.json
      - name: CLI na zywo - Klejnoty (ukryte karty, trzech graczy)
        run: dotnet run --project src/BalanceLab.Cli -- simulate --game klejnoty --bots greedy ismcts:50 random --games 30 --out klejnoty.json
      - name: CLI na zywo - raport balansu (liga profili, wariant zasad, HTML)
        run: |
          dotnet run --project src/BalanceLab.Cli -- league --game klejnoty --bots greedy:silnik greedy:punkty greedy:zetony --games 40 --html league.html
          dotnet run --project src/BalanceLab.Cli -- compare --game klejnoty --bots greedy:silnik greedy --games 100 --variant "card77.points=4; win=14" --html compare.html
      - name: CLI na zywo - dziennik partii w PostgreSQL (zapis, powtorka z migawki, weryfikacja)
        env:
          BALANCE_LAB_DB: Host=localhost;Username=postgres;Password=ci;Database=balance_lab
        run: |
          id=$(dotnet run --project src/BalanceLab.Cli -- play --game klejnoty --bots greedy ismcts:30 random --seed 7 | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27}' | head -1)
          dotnet run --project src/BalanceLab.Cli -- replay --match "$id" --at 40
      - name: Serwer gry na zywo (migracje przy starcie, katalog gier, lobby)
        env:
          BALANCE_LAB_DB: Host=localhost;Username=postgres;Password=ci;Database=balance_lab
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          dotnet run --project src/BalanceLab.Api &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health && break; sleep 1; done
          curl -sf http://localhost:5080/api/games | grep -q klejnoty
          curl -sf http://localhost:5080/api/rooms
          kill %1

  mutation:
    # Kazdy projekt w osobnym, rownoleglym zadaniu: CI trwa tyle, co najwolniejszy, a nie suma.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [stryker-config.json, stryker-connectfour.json, stryker-klejnoty.json, stryker-bots.json, stryker-simulation.json, stryker-reporting.json, stryker-cli.json, stryker-persistence.json, stryker-catalog.json, stryker-multiplayer.json, stryker-api.json]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Mutation testing (Stryker, prog 90%)
        run: |
          dotnet tool restore
          dotnet stryker -f ${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-${{ matrix.config }}
          path: StrykerOutput/**/reports
