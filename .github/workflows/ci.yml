name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jawne `shell: bash` to bash -eo pipefail: blad pierwszego polecenia w potoku przerywa krok.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Baza dla play/replay na zywo; testy integracyjne stawiaja wlasne kontenery (Testcontainers).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json', 'global.json') }}
      - name: Testy (jednostkowe, wlasnosci FsCheck, statystyczne, sily botow, architektura, integracyjne, hub SignalR i e2e na PostgreSQL)
        run: dotnet test
      - name: Benchmarki uruchamiaja sie (przebieg probny)
        run: dotnet run -c Release --project benchmarks/BalanceLab.Benchmarks -- --filter '*' --job dry
      - name: CLI na zywo
        run: dotnet run --project src/BalanceLab.Cli -- simulate --game connectfour --bots mcts:100 random --games 200 --out report.json
      - name: CLI na zywo - Klejnoty (ukryte karty, trzech graczy)
        run: dotnet run --project src/BalanceLab.Cli -- simulate --game klejnoty --bots greedy ismcts:50 random --games 30 --out klejnoty.json
      - name: CLI na zywo - Mozaika (druga gra przez ten sam symulator i raport)
        run: dotnet run --project src/BalanceLab.Cli -- league --game mozaika --bots greedy greedy:kolumny greedy:ostrozny --games 30 --variant "column=5" --html mozaika.html
      - name: CLI na zywo - raport balansu (liga profili, wariant zasad, HTML)
        run: |
          dotnet run --project src/BalanceLab.Cli -- league --game klejnoty --bots greedy:silnik greedy:punkty greedy:zetony --games 40 --html league.html
          dotnet run --project src/BalanceLab.Cli -- compare --game klejnoty --bots greedy:silnik greedy --games 100 --variant "card77.points=4; win=14" --html compare.html
      - name: CLI na zywo - dziennik partii w PostgreSQL (zapis, powtorka z migawki, weryfikacja)
        env:
          BALANCE_LAB_DB: Host=localhost;Username=postgres;Password=ci;Database=balance_lab
        run: |
          id=$(dotnet run --project src/BalanceLab.Cli -- play --game klejnoty --bots greedy ismcts:30 random --seed 7 | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27}' | sed -n 1p)
          test -n "$id"
          dotnet run --project src/BalanceLab.Cli -- replay --match "$id" --at 40
      - name: Serwer gry na zywo (migracje przy starcie, katalog gier, lobby)
        env:
          BALANCE_LAB_DB: Host=localhost;Username=postgres;Password=ci;Database=balance_lab
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          dotnet run --project src/BalanceLab.Api &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health && break; sleep 1; done
          curl -sf http://localhost:5080/api/games | grep -q klejnoty
          curl -sf http://localhost:5080/api/games/mozaika/rules | grep -q floorPenalties
          curl -sf -X POST http://localhost:5080/api/experiments -H 'Content-Type: application/json'             -d '{"game":"connectfour","kind":"Tournament","bots":["mcts:50","random"],"games":20,"seed":"1"}' | grep -q Queued
          curl -sf http://localhost:5080/api/rooms
          kill %1

  second-game:
    # Dowod z etapu 10: Mozaika weszla bez zmian w silniku, botach, symulatorze, raporcie, dzienniku, pokojach, serwerze i CLI.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Kod poza gra, katalogiem i frontem bez zmian od etapu 9
        run: sh scripts/second-game-unchanged.sh

  mutation:
    # Kazdy projekt w osobnym, rownoleglym zadaniu: CI trwa tyle, co najwolniejszy, a nie suma.
    runs-on: ubuntu-24.04
    # Klejnoty w calosci liczyly sie 3,5-4 h, wiec sa w dwoch zadaniach (zasady i reszta, po ok. 330 mutantow);
    # limit lapie zawieszony przebieg dlugo przed domyslnymi 6 h.
    timeout-minutes: 270
    strategy:
      fail-fast: false
      matrix:
        config: [stryker-config.json, stryker-connectfour.json, stryker-klejnoty-zasady.json, stryker-klejnoty-reszta.json, stryker-mozaika.json, stryker-experiments.json, stryker-demo.json, stryker-bots.json, stryker-simulation.json, stryker-reporting.json, stryker-cli.json, stryker-persistence.json, stryker-catalog.json, stryker-multiplayer.json, stryker-api.json]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json', 'global.json') }}
      - name: Mutation testing (Stryker, prog 90%)
        # Mutant, po ktorym gra sie nie konczy, potrafi zajac kilka GB w kilka sekund i zabic
        # caly runner (np. f-- w petli warsztatow Mozaiki: rozdanie dokleja puste warsztaty bez konca).
        # Z limitem sterty proces testow dostaje OutOfMemoryException i mutant
        # pada jako zabity; zwykle przebiegi testow mieszcza sie ponizej 0,7 GB.
        env:
          DOTNET_GCHeapHardLimit: "0x80000000"
        run: |
          dotnet tool restore
          dotnet stryker -f ${{ matrix.config }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stryker-${{ matrix.config }}
          path: StrykerOutput/**/reports

  web:
    # Front: typy, format, lint, reguly architektury, testy z pokryciem, testy mutacyjne i build.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typy, format, lint, architektura (dependency-cruiser), testy (Vitest + fast-check)
        run: pnpm check
      - name: Mutation testing (Stryker, prog 90%)
        run: pnpm mutation
      - name: Build
        run: pnpm build

  e2e:
    # Przegladarka na prawdziwym serwerze gry z PostgreSQL: gra na zywo w trzy gry, powtorki i laboratorium balansu.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    env:
      BALANCE_LAB_DB: Host=localhost;Username=postgres;Password=ci;Database=balance_lab_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json', 'global.json') }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: dotnet build src/BalanceLab.Api
        working-directory: .
      - name: Przegladarka Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright
          path: web/playwright-report
