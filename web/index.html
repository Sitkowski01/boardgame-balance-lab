<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balance Lab</title>
    <meta
      name="description"
      content="Gry planszowe z botami MCTS i laboratorium balansu: turnieje, ligi Elo i porównania wariantów zasad z 95% przedziałami."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)" />
    <script>
      // Motyw wybrany wczesniej (theme.ts: ten sam klucz i atrybut) przed pierwszym malowaniem, bez mrugniecia jasnym tlem.
      try {
        var theme = localStorage.getItem("balance-lab:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {
        // Bez dostepu do pamieci strona idzie za motywem systemu.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
